name: Publish Wiki
on:
  push:
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Wiki
        run: ./gradlew dokkaGenerate

      - name: Upload Wiki
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/dokka/html

  deploy:
    needs: build
    # Forks publish every commit as a preview; the canonical repo publishes master and releases only.
    if: >-
      github.repository != 'tolgee/tolgee-mobile-kotlin-sdk'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
